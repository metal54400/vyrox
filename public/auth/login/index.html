<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#09090b">
    <title>Connexion — Vyrox AI</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../style.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        vyrox: {
                            cyan: '#00d4ff',
                            purple: '#a855f7',
                            pink: '#ec4899',
                            dark: '#09090b',
                            darker: '#050507',
                            card: '#12121a',
                            hover: '#1a1a25',
                            border: '#27272f',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-vyrox-dark text-gray-100 font-sans antialiased min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    
    <!-- Background Effects -->
    <div class="fixed inset-0 z-0">
        <div class="absolute top-0 left-1/4 w-96 h-96 bg-vyrox-cyan/10 rounded-full blur-3xl animate-pulse"></div>
        <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-vyrox-purple/10 rounded-full blur-3xl animate-pulse" style="animation-delay: 1s;"></div>
        <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAiIGhlaWdodD0iNjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGRlZnM+PHBhdHRlcm4gaWQ9ImdyaWQiIHdpZHRoPSI2MCIgaGVpZ2h0PSI2MCIgcGF0dGVyblVuaXRzPSJ1c2VyU3BhY2VPblVzZSI+PHBhdGggZD0iTSA2MCAwIEwgMCAwIDAgNjAiIGZpbGw9Im5vbmUiIHN0cm9rZT0icmdiYSgyNTUsMjU1LDI1NSwwLjAzKSIgc3Ryb2tlLXdpZHRoPSIxIi8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSJ1cmwoI2dyaWQpIi8+PC9zdmc+')] opacity-40"></div>
    </div>

    <!-- Login Container -->
    <div class="relative z-10 w-full max-w-md">
        
        <!-- Logo & Header -->
        <div class="text-center mb-8 animate-fade-in">
            <a href="/" class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-vyrox-cyan via-vyrox-purple to-vyrox-pink shadow-2xl shadow-vyrox-purple/30 mb-4 hover:scale-110 transition-transform duration-300">
                <i class="fa-solid fa-brain text-3xl text-white"></i>
            </a>
            <h1 class="text-3xl font-bold mb-2">
                <span class="bg-gradient-to-r from-vyrox-cyan to-vyrox-purple bg-clip-text text-transparent">Bon retour !</span>
            </h1>
            <p class="text-gray-400 text-sm">Connecte-toi pour retrouver tes conversations</p>
        </div>

        <!-- Login Card -->
        <div class="bg-vyrox-card/80 backdrop-blur-xl border border-vyrox-border rounded-2xl p-8 shadow-2xl animate-slide-up">
            
            <form id="loginForm" class="space-y-5" novalidate>
                
                <!-- Identifier Field -->
                <div class="space-y-2">
                    <label for="identifier" class="text-sm font-medium text-gray-300 flex items-center gap-2">
                        <i class="fa-solid fa-user text-vyrox-cyan text-xs"></i>
                        Nom d'utilisateur ou email
                    </label>
                    <div class="relative">
                        <input 
                            type="text" 
                            id="identifier" 
                            name="identifier"
                            placeholder="ton_pseudo ou email@exemple.com"
                            autocomplete="username"
                            required
                            class="w-full bg-vyrox-darker border border-vyrox-border rounded-lg px-4 py-3 text-gray-100 placeholder-gray-500 focus:outline-none focus:border-vyrox-cyan focus:ring-2 focus:ring-vyrox-cyan/20 transition-all duration-200"
                        >
                        <i class="fa-solid fa-circle-check absolute right-3 top-1/2 -translate-y-1/2 text-green-500 hidden" id="identifierValid"></i>
                    </div>
                    <p class="text-xs text-red-400 hidden" id="identifierError">
                        <i class="fa-solid fa-circle-exclamation mr-1"></i>
                        <span></span>
                    </p>
                </div>

                <!-- Password Field -->
                <div class="space-y-2">
                    <label for="password" class="text-sm font-medium text-gray-300 flex items-center gap-2">
                        <i class="fa-solid fa-lock text-vyrox-purple text-xs"></i>
                        Mot de passe
                    </label>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="password" 
                            name="password"
                            placeholder="••••••••"
                            autocomplete="current-password"
                            required
                            class="w-full bg-vyrox-darker border border-vyrox-border rounded-lg px-4 py-3 pr-12 text-gray-100 placeholder-gray-500 focus:outline-none focus:border-vyrox-purple focus:ring-2 focus:ring-vyrox-purple/20 transition-all duration-200"
                        >
                        <button 
                            type="button" 
                            id="togglePassword"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300 transition-colors"
                        >
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                    <p class="text-xs text-red-400 hidden" id="passwordError">
                        <i class="fa-solid fa-circle-exclamation mr-1"></i>
                        <span></span>
                    </p>
                </div>

                <!-- Remember & Forgot -->
                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center gap-2 cursor-pointer group">
                        <input type="checkbox" class="toggle-checkbox" id="remember">
                        <span class="text-gray-400 group-hover:text-gray-300 transition-colors">Se souvenir de moi</span>
                    </label>
                    <a href="#" class="text-vyrox-cyan hover:text-vyrox-purple transition-colors font-medium">
                        Mot de passe oublié ?
                    </a>
                </div>

                <!-- Error Message -->
                <div id="formError" class="hidden bg-red-500/10 border border-red-500/30 rounded-lg p-3 text-sm text-red-400">
                    <i class="fa-solid fa-triangle-exclamation mr-2"></i>
                    <span></span>
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit" 
                    id="submitBtn"
                    class="w-full bg-gradient-to-r from-vyrox-cyan to-vyrox-purple hover:from-vyrox-cyan/90 hover:to-vyrox-purple/90 text-white font-semibold py-3 rounded-lg transition-all duration-200 hover:shadow-lg hover:shadow-vyrox-purple/30 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2"
                >
                    <span id="btnText">Se connecter</span>
                    <i class="fa-solid fa-arrow-right" id="btnIcon"></i>
                    <div id="btnLoader" class="hidden">
                        <i class="fa-solid fa-circle-notch fa-spin"></i>
                    </div>
                </button>
            </form>

            <!-- Divider -->
            <div class="flex items-center gap-3 my-6">
                <div class="flex-1 h-px bg-vyrox-border"></div>
                <span class="text-xs text-gray-500 uppercase tracking-wider">ou</span>
                <div class="flex-1 h-px bg-vyrox-border"></div>
            </div>

            <!-- Social Login (placeholder) -->
            <div class="grid grid-cols-2 gap-3">
                <button class="flex items-center justify-center gap-2 px-4 py-2.5 bg-vyrox-darker border border-vyrox-border rounded-lg hover:bg-vyrox-hover transition-colors text-sm text-gray-300">
                    <i class="fa-brands fa-google text-red-500"></i>
                    Google
                </button>
                <button class="flex items-center justify-center gap-2 px-4 py-2.5 bg-vyrox-darker border border-vyrox-border rounded-lg hover:bg-vyrox-hover transition-colors text-sm text-gray-300">
                    <i class="fa-brands fa-github text-white"></i>
                    GitHub
                </button>
            </div>

            <!-- Footer -->
            <div class="text-center mt-6 pt-6 border-t border-vyrox-border">
                <p class="text-sm text-gray-400">
                    Pas encore de compte ? 
                    <a href="/auth/register" class="text-vyrox-cyan hover:text-vyrox-purple font-semibold transition-colors">
                        Créer un compte
                    </a>
                </p>
            </div>
        </div>

        <!-- Back to home -->
        <div class="text-center mt-6">
            <a href="/" class="text-sm text-gray-500 hover:text-gray-300 transition-colors inline-flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i>
                Retour à l'accueil
            </a>
        </div>

        <!-- License -->
        <div class="text-center mt-4">
            <p class="text-xs text-gray-600">© 2026-2029 Orinstudio — Tous droits réservés</p>
        </div>
    </div>

    <script>
        // Toggle password visibility
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            togglePassword.querySelector('i').className = type === 'password' ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash';
        });

        // Form submission
        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');
        const btnLoader = document.getElementById('btnLoader');
        const formError = document.getElementById('formError');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Hide previous errors
            formError.classList.add('hidden');
            document.querySelectorAll('[id$="Error"]').forEach(el => el.classList.add('hidden'));
            
            const identifier = document.getElementById('identifier').value.trim();
            const password = passwordInput.value;

            // Validation
            if (!identifier) {
                showError('identifierError', 'Nom d\'utilisateur ou email requis');
                return;
            }

            if (!password) {
                showError('passwordError', 'Mot de passe requis');
                return;
            }

            // Loading state
            submitBtn.disabled = true;
            btnText.textContent = 'Connexion...';
            btnIcon.classList.add('hidden');
            btnLoader.classList.remove('hidden');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier, password })
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('vyrox_user', JSON.stringify(data.user));
                    localStorage.setItem('vyrox_token', data.token);
                    
                    // Success animation
                    submitBtn.innerHTML = '<i class="fa-solid fa-check"></i> Connecté !';
                    submitBtn.classList.remove('from-vyrox-cyan', 'to-vyrox-purple');
                    submitBtn.classList.add('from-green-500', 'to-emerald-600');
                    
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 800);
                } else {
                    formError.querySelector('span').textContent = data.error;
                    formError.classList.remove('hidden');
                }
            } catch (err) {
                formError.querySelector('span').textContent = 'Erreur de connexion au serveur';
                formError.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = 'Se connecter';
                btnIcon.classList.remove('hidden');
                btnLoader.classList.add('hidden');
            }
        });

        function showError(id, message) {
            const errorEl = document.getElementById(id);
            errorEl.querySelector('span').textContent = message;
            errorEl.classList.remove('hidden');
        }

        // Check if already logged in
        if (localStorage.getItem('vyrox_token')) {
            fetch('/api/auth/me')
                .then(r => r.json())
                .then(data => {
                    if (data.success) window.location.href = '/';
                })
                .catch(() => {});
        }
    </script>
</body>
</html>
