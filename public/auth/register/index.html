<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#09090b">
    <title>Inscription — Vyrox AI</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../style.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        vyrox: {
                            cyan: '#00d4ff',
                            purple: '#a855f7',
                            pink: '#ec4899',
                            dark: '#09090b',
                            darker: '#050507',
                            card: '#12121a',
                            hover: '#1a1a25',
                            border: '#27272f',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-vyrox-dark text-gray-100 font-sans antialiased min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    
    <!-- Background Effects -->
    <div class="fixed inset-0 z-0">
        <div class="absolute top-0 right-1/4 w-96 h-96 bg-vyrox-purple/10 rounded-full blur-3xl animate-pulse"></div>
        <div class="absolute bottom-0 left-1/4 w-96 h-96 bg-vyrox-pink/10 rounded-full blur-3xl animate-pulse" style="animation-delay: 1s;"></div>
        <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAiIGhlaWdodD0iNjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGRlZnM+PHBhdHRlcm4gaWQ9ImdyaWQiIHdpZHRoPSI2MCIgaGVpZ2h0PSI2MCIgcGF0dGVyblVuaXRzPSJ1c2VyU3BhY2VPblVzZSI+PHBhdGggZD0iTSA2MCAwIEwgMCAwIDAgNjAiIGZpbGw9Im5vbmUiIHN0cm9rZT0icmdiYSgyNTUsMjU1LDI1NSwwLjAzKSIgc3Ryb2tlLXdpZHRoPSIxIi8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSJ1cmwoI2dyaWQpIi8+PC9zdmc+')] opacity-40"></div>
    </div>

    <!-- Register Container -->
    <div class="relative z-10 w-full max-w-md">
        
        <!-- Logo & Header -->
        <div class="text-center mb-8 animate-fade-in">
            <a href="/" class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-vyrox-purple via-vyrox-pink to-vyrox-cyan shadow-2xl shadow-vyrox-pink/30 mb-4 hover:scale-110 transition-transform duration-300">
                <i class="fa-solid fa-rocket text-3xl text-white"></i>
            </a>
            <h1 class="text-3xl font-bold mb-2">
                <span class="bg-gradient-to-r from-vyrox-purple to-vyrox-pink bg-clip-text text-transparent">Rejoins Vyrox</span>
            </h1>
            <p class="text-gray-400 text-sm">Crée ton compte en 30 secondes</p>
        </div>

        <!-- Register Card -->
        <div class="bg-vyrox-card/80 backdrop-blur-xl border border-vyrox-border rounded-2xl p-8 shadow-2xl animate-slide-up">
            
            <form id="registerForm" class="space-y-4" novalidate>
                
                <!-- Username Field -->
                <div class="space-y-2">
                    <label for="username" class="text-sm font-medium text-gray-300 flex items-center gap-2">
                        <i class="fa-solid fa-at text-vyrox-cyan text-xs"></i>
                        Nom d'utilisateur
                    </label>
                    <div class="relative">
                        <input 
                            type="text" 
                            id="username" 
                            name="username"
                            placeholder="ton_pseudo"
                            autocomplete="username"
                            required
                            minlength="3"
                            maxlength="30"
                            pattern="[a-zA-Z0-9_\-]+"
                            class="w-full bg-vyrox-darker border border-vyrox-border rounded-lg px-4 py-3 text-gray-100 placeholder-gray-500 focus:outline-none focus:border-vyrox-cyan focus:ring-2 focus:ring-vyrox-cyan/20 transition-all duration-200"
                        >
                        <i class="fa-solid fa-circle-check absolute right-3 top-1/2 -translate-y-1/2 text-green-500 hidden" id="usernameValid"></i>
                    </div>
                    <p class="text-xs text-red-400 hidden" id="usernameError">
                        <i class="fa-solid fa-circle-exclamation mr-1"></i>
                        <span></span>
                    </p>
                    <p class="text-xs text-gray-500">Lettres, chiffres, _ et - uniquement</p>
                </div>

                <!-- Email Field -->
                <div class="space-y-2">
                    <label for="email" class="text-sm font-medium text-gray-300 flex items-center gap-2">
                        <i class="fa-solid fa-envelope text-vyrox-purple text-xs"></i>
                        Email
                    </label>
                    <div class="relative">
                        <input 
                            type="email" 
                            id="email" 
                            name="email"
                            placeholder="ton@email.com"
                            autocomplete="email"
                            required
                            class="w-full bg-vyrox-darker border border-vyrox-border rounded-lg px-4 py-3 text-gray-100 placeholder-gray-500 focus:outline-none focus:border-vyrox-purple focus:ring-2 focus:ring-vyrox-purple/20 transition-all duration-200"
                        >
                        <i class="fa-solid fa-circle-check absolute right-3 top-1/2 -translate-y-1/2 text-green-500 hidden" id="emailValid"></i>
                    </div>
                    <p class="text-xs text-red-400 hidden" id="emailError">
                        <i class="fa-solid fa-circle-exclamation mr-1"></i>
                        <span></span>
                    </p>
                </div>

                <!-- Password Field -->
                <div class="space-y-2">
                    <label for="password" class="text-sm font-medium text-gray-300 flex items-center gap-2">
                        <i class="fa-solid fa-lock text-vyrox-pink text-xs"></i>
                        Mot de passe
                    </label>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="password" 
                            name="password"
                            placeholder="8+ caractères, 1 majuscule, 1 chiffre"
                            autocomplete="new-password"
                            required
                            minlength="8"
                            class="w-full bg-vyrox-darker border border-vyrox-border rounded-lg px-4 py-3 pr-12 text-gray-100 placeholder-gray-500 focus:outline-none focus:border-vyrox-pink focus:ring-2 focus:ring-vyrox-pink/20 transition-all duration-200"
                        >
                        <button 
                            type="button" 
                            id="togglePassword"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300 transition-colors"
                        >
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                    
                    <!-- Password Strength -->
                    <div class="space-y-1">
                        <div class="flex gap-1">
                            <div class="h-1 flex-1 rounded-full bg-vyrox-border overflow-hidden">
                                <div class="h-full bg-red-500 transition-all duration-300" id="strengthBar1" style="width: 0%"></div>
                            </div>
                            <div class="h-1 flex-1 rounded-full bg-vyrox-border overflow-hidden">
                                <div class="h-full bg-orange-500 transition-all duration-300" id="strengthBar2" style="width: 0%"></div>
                            </div>
                            <div class="h-1 flex-1 rounded-full bg-vyrox-border overflow-hidden">
                                <div class="h-full bg-yellow-500 transition-all duration-300" id="strengthBar3" style="width: 0%"></div>
                            </div>
                            <div class="h-1 flex-1 rounded-full bg-vyrox-border overflow-hidden">
                                <div class="h-full bg-green-500 transition-all duration-300" id="strengthBar4" style="width: 0%"></div>
                            </div>
                        </div>
                        <p class="text-xs text-gray-500" id="strengthText">Force du mot de passe</p>
                    </div>
                    
                    <p class="text-xs text-red-400 hidden" id="passwordError">
                        <i class="fa-solid fa-circle-exclamation mr-1"></i>
                        <span></span>
                    </p>
                </div>

                <!-- Confirm Password Field -->
                <div class="space-y-2">
                    <label for="confirmPassword" class="text-sm font-medium text-gray-300 flex items-center gap-2">
                        <i class="fa-solid fa-lock text-gray-400 text-xs"></i>
                        Confirmer le mot de passe
                    </label>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            name="confirmPassword"
                            placeholder="Retape ton mot de passe"
                            autocomplete="new-password"
                            required
                            class="w-full bg-vyrox-darker border border-vyrox-border rounded-lg px-4 py-3 pr-12 text-gray-100 placeholder-gray-500 focus:outline-none focus:border-vyrox-cyan focus:ring-2 focus:ring-vyrox-cyan/20 transition-all duration-200"
                        >
                        <i class="fa-solid fa-circle-check absolute right-3 top-1/2 -translate-y-1/2 text-green-500 hidden" id="confirmValid"></i>
                    </div>
                    <p class="text-xs text-red-400 hidden" id="confirmError">
                        <i class="fa-solid fa-circle-exclamation mr-1"></i>
                        <span></span>
                    </p>
                </div>

                <!-- Terms -->
                <label class="flex items-start gap-2 cursor-pointer group">
                    <input type="checkbox" id="terms" required class="toggle-checkbox mt-1">
                    <span class="text-xs text-gray-400 group-hover:text-gray-300 transition-colors">
                        J'accepte les <a href="#" class="text-vyrox-cyan hover:underline">conditions d'utilisation</a> et la <a href="#" class="text-vyrox-cyan hover:underline">politique de confidentialité</a>
                    </span>
                </label>

                <!-- Error Message -->
                <div id="formError" class="hidden bg-red-500/10 border border-red-500/30 rounded-lg p-3 text-sm text-red-400">
                    <i class="fa-solid fa-triangle-exclamation mr-2"></i>
                    <span></span>
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit" 
                    id="submitBtn"
                    class="w-full bg-gradient-to-r from-vyrox-purple to-vyrox-pink hover:from-vyrox-purple/90 hover:to-vyrox-pink/90 text-white font-semibold py-3 rounded-lg transition-all duration-200 hover:shadow-lg hover:shadow-vyrox-pink/30 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2"
                >
                    <span id="btnText">Créer mon compte</span>
                    <i class="fa-solid fa-arrow-right" id="btnIcon"></i>
                    <div id="btnLoader" class="hidden">
                        <i class="fa-solid fa-circle-notch fa-spin"></i>
                    </div>
                </button>
            </form>

            <!-- Divider -->
            <div class="flex items-center gap-3 my-6">
                <div class="flex-1 h-px bg-vyrox-border"></div>
                <span class="text-xs text-gray-500 uppercase tracking-wider">ou</span>
                <div class="flex-1 h-px bg-vyrox-border"></div>
            </div>

            <!-- Social Register -->
            <div class="grid grid-cols-2 gap-3">
                <button class="flex items-center justify-center gap-2 px-4 py-2.5 bg-vyrox-darker border border-vyrox-border rounded-lg hover:bg-vyrox-hover transition-colors text-sm text-gray-300">
                    <i class="fa-brands fa-google text-red-500"></i>
                    Google
                </button>
                <button class="flex items-center justify-center gap-2 px-4 py-2.5 bg-vyrox-darker border border-vyrox-border rounded-lg hover:bg-vyrox-hover transition-colors text-sm text-gray-300">
                    <i class="fa-brands fa-github text-white"></i>
                    GitHub
                </button>
            </div>

            <!-- Footer -->
            <div class="text-center mt-6 pt-6 border-t border-vyrox-border">
                <p class="text-sm text-gray-400">
                    Déjà un compte ? 
                    <a href="/auth/login" class="text-vyrox-purple hover:text-vyrox-pink font-semibold transition-colors">
                        Se connecter
                    </a>
                </p>
            </div>
        </div>

        <!-- Back to home -->
        <div class="text-center mt-6">
            <a href="/" class="text-sm text-gray-500 hover:text-gray-300 transition-colors inline-flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i>
                Retour à l'accueil
            </a>
        </div>

        <!-- License -->
        <div class="text-center mt-4">
            <p class="text-xs text-gray-600">© 2026-2029 Orinstudio — Tous droits réservés</p>
        </div>
    </div>

    <script>
        // Toggle password visibility
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirmPassword');
        
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            confirmInput.type = type;
            togglePassword.querySelector('i').className = type === 'password' ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash';
        });

        // Password strength checker
        passwordInput.addEventListener('input', () => {
            const pwd = passwordInput.value;
            let score = 0;
            
            if (pwd.length >= 8) score++;
            if (/[A-Z]/.test(pwd)) score++;
            if (/[0-9]/.test(pwd)) score++;
            if (/[^A-Za-z0-9]/.test(pwd)) score++;

            // Update bars
            for (let i = 1; i <= 4; i++) {
                const bar = document.getElementById(`strengthBar${i}`);
                if (i <= score) {
                    bar.style.width = '100%';
                } else {
                    bar.style.width = '0%';
                }
            }

            // Update text
            const strengthText = document.getElementById('strengthText');
            const labels = ['Force du mot de passe', 'Faible', 'Moyen', 'Fort', 'Très fort'];
            const colors = ['text-gray-500', 'text-red-500', 'text-orange-500', 'text-yellow-500', 'text-green-500'];
            strengthText.textContent = labels[score];
            strengthText.className = `text-xs ${colors[score]}`;
        });

        // Form submission
        const form = document.getElementById('registerForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');
        const btnLoader = document.getElementById('btnLoader');
        const formError = document.getElementById('formError');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Hide previous errors
            formError.classList.add('hidden');
            document.querySelectorAll('[id$="Error"]').forEach(el => el.classList.add('hidden'));
            
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmInput.value;
            const terms = document.getElementById('terms').checked;

            let valid = true;

            // Validation
            if (username.length < 3) {
                showError('usernameError', 'Minimum 3 caractères');
                valid = false;
            } else if (!/^[a-zA-Z0-9_\-]+$/.test(username)) {
                showError('usernameError', 'Lettres, chiffres, _ et - uniquement');
                valid = false;
            }

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showError('emailError', 'Format d\'email invalide');
                valid = false;
            }

            if (password.length < 8) {
                showError('passwordError', 'Minimum 8 caractères');
                valid = false;
            } else if (!/[A-Z]/.test(password)) {
                showError('passwordError', 'Au moins une majuscule requise');
                valid = false;
            } else if (!/[0-9]/.test(password)) {
                showError('passwordError', 'Au moins un chiffre requis');
                valid = false;
            }

            if (password !== confirmPassword) {
                showError('confirmError', 'Les mots de passe ne correspondent pas');
                valid = false;
            }

            if (!terms) {
                formError.querySelector('span').textContent = 'Vous devez accepter les conditions';
                formError.classList.remove('hidden');
                valid = false;
            }

            if (!valid) return;

            // Loading state
            submitBtn.disabled = true;
            btnText.textContent = 'Création...';
            btnIcon.classList.add('hidden');
            btnLoader.classList.remove('hidden');

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('vyrox_user', JSON.stringify(data.user));
                    localStorage.setItem('vyrox_token', data.token);
                    
                    // Success animation
                    submitBtn.innerHTML = '<i class="fa-solid fa-check"></i> Compte créé !';
                    submitBtn.classList.remove('from-vyrox-purple', 'to-vyrox-pink');
                    submitBtn.classList.add('from-green-500', 'to-emerald-600');
                    
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 800);
                } else {
                    if (data.error.includes('utilisateur')) {
                        showError('usernameError', data.error);
                    } else if (data.error.includes('email')) {
                        showError('emailError', data.error);
                    } else {
                        formError.querySelector('span').textContent = data.error;
                        formError.classList.remove('hidden');
                    }
                }
            } catch (err) {
                formError.querySelector('span').textContent = 'Erreur serveur';
                formError.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = 'Créer mon compte';
                btnIcon.classList.remove('hidden');
                btnLoader.classList.add('hidden');
            }
        });

        function showError(id, message) {
            const errorEl = document.getElementById(id);
            errorEl.querySelector('span').textContent = message;
            errorEl.classList.remove('hidden');
        }

        // Real-time validation indicators
        document.getElementById('username').addEventListener('input', (e) => {
            const valid = /^[a-zA-Z0-9_\-]{3,}$/.test(e.target.value);
            document.getElementById('usernameValid').classList.toggle('hidden', !valid);
        });

        document.getElementById('email').addEventListener('input', (e) => {
            const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e.target.value);
            document.getElementById('emailValid').classList.toggle('hidden', !valid);
        });

        confirmInput.addEventListener('input', (e) => {
            const valid = e.target.value === passwordInput.value && e.target.value.length > 0;
            document.getElementById('confirmValid').classList.toggle('hidden', !valid);
        });
    </script>
</body>
</html>
