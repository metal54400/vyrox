<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#09090b">
    <title>Inscription — Vyrox AI</title>
    <link rel="icon" href="/favicon.png" type="image/png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    colors: {
                        vyrox: {
                            cyan: '#00d4ff',
                            purple: '#a855f7',
                            pink: '#ec4899',
                            dark: '#09090b',
                            darker: '#050507',
                            card: '#12121a',
                            hover: '#1a1a25',
                            border: '#27272f',
                        }
                    },
                    animation: {
                        'blob': 'blob 7s infinite',
                        'shake': 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both',
                        'fade-in': 'fadeIn 0.5s ease-out',
                        'slide-up': 'slideUp 0.5s ease-out'
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        shake: {
                            '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                            '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                            '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                            '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
                        },
                        fadeIn: { from: { opacity: 0 }, to: { opacity: 1 } },
                        slideUp: { from: { opacity: 0, transform: 'translateY(20px)' }, to: { opacity: 1, transform: 'translateY(0)' } }
                    }
                }
            }
        }
    </script>

    <style>
        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }
    </style>
</head>
<body class="bg-vyrox-dark text-gray-100 font-sans antialiased min-h-screen flex items-center justify-center p-4 relative overflow-hidden selection:bg-vyrox-purple/30 selection:text-white">
    
    <!-- Background Effects -->
    <div class="fixed inset-0 z-0 pointer-events-none">
        <div class="absolute top-0 right-1/4 w-96 h-96 bg-vyrox-purple/10 rounded-full blur-3xl animate-blob"></div>
        <div class="absolute bottom-0 left-1/4 w-96 h-96 bg-vyrox-pink/10 rounded-full blur-3xl animate-blob" style="animation-delay: 2s;"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-vyrox-cyan/5 rounded-full blur-3xl animate-blob" style="animation-delay: 4s;"></div>
        <div class="absolute inset-0 bg-grid opacity-40"></div>
    </div>

    <!-- Register Container -->
    <div class="relative z-10 w-full max-w-md animate-fade-in">
        
        <!-- Logo & Header -->
        <div class="text-center mb-8">
            <a href="/" class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-vyrox-purple via-vyrox-pink to-vyrox-cyan shadow-2xl shadow-vyrox-pink/30 mb-4 hover:scale-110 hover:rotate-3 transition-all duration-300 group">
                <i class="fa-solid fa-rocket text-3xl text-white group-hover:animate-pulse"></i>
            </a>
            <h1 class="text-3xl font-bold mb-2">
                <span class="bg-gradient-to-r from-vyrox-purple to-vyrox-pink bg-clip-text text-transparent">Rejoins Vyrox</span>
            </h1>
            <p class="text-gray-400 text-sm">Crée ton compte en quelques secondes</p>
        </div>

        <!-- Register Card -->
        <div class="bg-vyrox-card/80 backdrop-blur-xl border border-vyrox-border rounded-2xl p-8 shadow-2xl animate-slide-up hover:border-vyrox-purple/30 transition-colors duration-300">
            
            <form id="registerForm" class="space-y-5" novalidate>
                
                <!-- Username Field -->
                <div class="space-y-2 group">
                    <label for="username" class="text-sm font-medium text-gray-300 flex items-center gap-2 transition-colors group-focus-within:text-vyrox-cyan">
                        <i class="fa-solid fa-at text-xs"></i>
                        Nom d'utilisateur
                    </label>
                    <div class="relative">
                        <input 
                            type="text" 
                            id="username" 
                            name="username"
                            placeholder="ton_pseudo"
                            autocomplete="username"
                            required
                            minlength="3"
                            maxlength="30"
                            pattern="[a-zA-Z0-9_\-]+"
                            aria-describedby="usernameError usernameHint"
                            class="w-full bg-vyrox-darker border border-vyrox-border rounded-lg px-4 py-3 text-gray-100 placeholder-gray-600 focus:outline-none focus:border-vyrox-cyan focus:ring-2 focus:ring-vyrox-cyan/20 transition-all duration-200"
                        >
                        <i class="fa-solid fa-circle-check absolute right-3 top-1/2 -translate-y-1/2 text-green-500 opacity-0 transition-opacity duration-200" id="usernameValid"></i>
                    </div>
                    <p class="text-xs text-gray-500" id="usernameHint">Lettres, chiffres, _ et - uniquement</p>
                    <p class="text-xs text-red-400 hidden flex items-center gap-1" id="usernameError" role="alert">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <span></span>
                    </p>
                </div>

                <!-- Email Field -->
                <div class="space-y-2 group">
                    <label for="email" class="text-sm font-medium text-gray-300 flex items-center gap-2 transition-colors group-focus-within:text-vyrox-purple">
                        <i class="fa-solid fa-envelope text-xs"></i>
                        Adresse email
                    </label>
                    <div class="relative">
                        <input 
                            type="email" 
                            id="email" 
                            name="email"
                            placeholder="ton@email.com"
                            autocomplete="email"
                            required
                            aria-describedby="emailError"
                            class="w-full bg-vyrox-darker border border-vyrox-border rounded-lg px-4 py-3 text-gray-100 placeholder-gray-600 focus:outline-none focus:border-vyrox-purple focus:ring-2 focus:ring-vyrox-purple/20 transition-all duration-200"
                        >
                        <i class="fa-solid fa-circle-check absolute right-3 top-1/2 -translate-y-1/2 text-green-500 opacity-0 transition-opacity duration-200" id="emailValid"></i>
                    </div>
                    <p class="text-xs text-red-400 hidden flex items-center gap-1" id="emailError" role="alert">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <span></span>
                    </p>
                </div>

                <!-- Password Field -->
                <div class="space-y-2 group">
                    <label for="password" class="text-sm font-medium text-gray-300 flex items-center gap-2 transition-colors group-focus-within:text-vyrox-pink">
                        <i class="fa-solid fa-lock text-xs"></i>
                        Mot de passe
                    </label>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="password" 
                            name="password"
                            placeholder="••••••••"
                            autocomplete="new-password"
                            required
                            minlength="8"
                            aria-describedby="passwordError strengthText"
                            class="w-full bg-vyrox-darker border border-vyrox-border rounded-lg px-4 py-3 pr-12 text-gray-100 placeholder-gray-600 focus:outline-none focus:border-vyrox-pink focus:ring-2 focus:ring-vyrox-pink/20 transition-all duration-200"
                        >
                        <button 
                            type="button" 
                            id="togglePassword"
                            aria-label="Afficher le mot de passe"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300 transition-colors p-1"
                        >
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                    
                    <!-- Password Strength -->
                    <div class="space-y-1.5 pt-1">
                        <div class="flex gap-1.5">
                            <div class="h-1.5 flex-1 rounded-full bg-vyrox-border overflow-hidden">
                                <div class="h-full bg-red-500 transition-all duration-500 ease-out" id="strengthBar1" style="width: 0%"></div>
                            </div>
                            <div class="h-1.5 flex-1 rounded-full bg-vyrox-border overflow-hidden">
                                <div class="h-full bg-orange-500 transition-all duration-500 ease-out" id="strengthBar2" style="width: 0%"></div>
                            </div>
                            <div class="h-1.5 flex-1 rounded-full bg-vyrox-border overflow-hidden">
                                <div class="h-full bg-yellow-500 transition-all duration-500 ease-out" id="strengthBar3" style="width: 0%"></div>
                            </div>
                            <div class="h-1.5 flex-1 rounded-full bg-vyrox-border overflow-hidden">
                                <div class="h-full bg-green-500 transition-all duration-500 ease-out" id="strengthBar4" style="width: 0%"></div>
                            </div>
                        </div>
                        <p class="text-xs font-medium transition-colors duration-300" id="strengthText">Force du mot de passe</p>
                    </div>
                    
                    <p class="text-xs text-red-400 hidden flex items-center gap-1" id="passwordError" role="alert">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <span></span>
                    </p>
                </div>

                <!-- Confirm Password Field -->
                <div class="space-y-2 group">
                    <label for="confirmPassword" class="text-sm font-medium text-gray-300 flex items-center gap-2 transition-colors group-focus-within:text-vyrox-cyan">
                        <i class="fa-solid fa-shield-halved text-xs"></i>
                        Confirmer le mot de passe
                    </label>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            name="confirmPassword"
                            placeholder="Retape ton mot de passe"
                            autocomplete="new-password"
                            required
                            aria-describedby="confirmError"
                            class="w-full bg-vyrox-darker border border-vyrox-border rounded-lg px-4 py-3 pr-12 text-gray-100 placeholder-gray-600 focus:outline-none focus:border-vyrox-cyan focus:ring-2 focus:ring-vyrox-cyan/20 transition-all duration-200"
                        >
                        <i class="fa-solid fa-circle-check absolute right-3 top-1/2 -translate-y-1/2 text-green-500 opacity-0 transition-opacity duration-200" id="confirmValid"></i>
                    </div>
                    <p class="text-xs text-red-400 hidden flex items-center gap-1" id="confirmError" role="alert">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <span></span>
                    </p>
                </div>

                <!-- Terms -->
                <label class="flex items-start gap-3 cursor-pointer group select-none">
                    <input type="checkbox" id="terms" required class="w-4 h-4 mt-0.5 rounded border-vyrox-border bg-vyrox-darker text-vyrox-purple focus:ring-vyrox-purple/20 focus:ring-2 cursor-pointer transition-all">
                    <span class="text-xs text-gray-400 group-hover:text-gray-300 transition-colors leading-relaxed">
                        J'accepte les <a href="#" class="text-vyrox-cyan hover:text-vyrox-purple hover:underline transition-colors">conditions d'utilisation</a> et la <a href="#" class="text-vyrox-cyan hover:text-vyrox-purple hover:underline transition-colors">politique de confidentialité</a>.
                    </span>
                </label>

                <!-- Global Error Message -->
                <div id="formError" class="hidden bg-red-500/10 border border-red-500/30 rounded-lg p-3 text-sm text-red-400 flex items-start gap-2" role="alert" aria-live="polite">
                    <i class="fa-solid fa-triangle-exclamation mt-0.5"></i>
                    <span></span>
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit" 
                    id="submitBtn"
                    class="w-full bg-gradient-to-r from-vyrox-purple to-vyrox-pink hover:from-vyrox-purple/90 hover:to-vyrox-pink/90 text-white font-semibold py-3 rounded-lg transition-all duration-200 hover:shadow-lg hover:shadow-vyrox-pink/30 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:shadow-none flex items-center justify-center gap-2 active:scale-[0.98]"
                >
                    <span id="btnText">Créer mon compte</span>
                    <i class="fa-solid fa-arrow-right transition-transform" id="btnIcon"></i>
                    <div id="btnLoader" class="hidden">
                        <i class="fa-solid fa-circle-notch fa-spin"></i>
                    </div>
                </button>
            </form>

            <!-- Divider -->
            <div class="flex items-center gap-3 my-6">
                <div class="flex-1 h-px bg-gradient-to-r from-transparent via-vyrox-border to-transparent"></div>
                <span class="text-xs text-gray-500 uppercase tracking-wider">ou continuer avec</span>
                <div class="flex-1 h-px bg-gradient-to-r from-transparent via-vyrox-border to-transparent"></div>
            </div>

            <!-- Social Register -->
            <div class="grid grid-cols-2 gap-3">
                <button type="button" class="flex items-center justify-center gap-2 px-4 py-2.5 bg-vyrox-darker border border-vyrox-border rounded-lg hover:bg-vyrox-hover hover:border-vyrox-border/80 transition-all duration-200 text-sm text-gray-300 group">
                    <i class="fa-brands fa-google text-red-500 group-hover:scale-110 transition-transform"></i>
                    Google
                </button>
                <button type="button" class="flex items-center justify-center gap-2 px-4 py-2.5 bg-vyrox-darker border border-vyrox-border rounded-lg hover:bg-vyrox-hover hover:border-vyrox-border/80 transition-all duration-200 text-sm text-gray-300 group">
                    <i class="fa-brands fa-github text-white group-hover:scale-110 transition-transform"></i>
                    GitHub
                </button>
            </div>

            <!-- Footer -->
            <div class="text-center mt-6 pt-6 border-t border-vyrox-border">
                <p class="text-sm text-gray-400">
                    Déjà un compte ? 
                    <a href="/auth/login" class="text-vyrox-purple hover:text-vyrox-pink font-semibold transition-colors hover:underline decoration-underline-offset-4">
                        Se connecter
                    </a>
                </p>
            </div>
        </div>

        <!-- Back to home -->
        <div class="text-center mt-6">
            <a href="/" class="text-sm text-gray-500 hover:text-gray-300 transition-colors inline-flex items-center gap-2 group">
                <i class="fa-solid fa-arrow-left group-hover:-translate-x-1 transition-transform"></i>
                Retour à l'accueil
            </a>
        </div>

        <!-- License -->
        <div class="text-center mt-4">
            <p class="text-xs text-gray-600">© 2026-2029 Orinstudio — Tous droits réservés</p>
        </div>
    </div>

    <script>
        // --- Éléments du DOM ---
        const form = document.getElementById('registerForm');
        const usernameInput = document.getElementById('username');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirmPassword');
        const togglePasswordBtn = document.getElementById('togglePassword');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');
        const btnLoader = document.getElementById('btnLoader');
        const formError = document.getElementById('formError');

        // --- Toggle Password Visibility ---
        togglePasswordBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            confirmInput.type = isPassword ? 'text' : 'password';
            togglePasswordBtn.querySelector('i').className = isPassword ? 'fa-solid fa-eye-slash text-vyrox-pink' : 'fa-solid fa-eye';
            togglePasswordBtn.setAttribute('aria-label', isPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe');
        });

        // --- Password Strength Checker ---
        passwordInput.addEventListener('input', () => {
            const pwd = passwordInput.value;
            let score = 0;
            
            if (pwd.length >= 8) score++;
            if (/[A-Z]/.test(pwd)) score++;
            if (/[0-9]/.test(pwd)) score++;
            if (/[^A-Za-z0-9]/.test(pwd)) score++;

            // Update bars with smooth transition
            for (let i = 1; i <= 4; i++) {
                const bar = document.getElementById(`strengthBar${i}`);
                bar.style.width = i <= score ? '100%' : '0%';
            }

            // Update text and color
            const strengthText = document.getElementById('strengthText');
            const labels = ['Force du mot de passe', 'Faible', 'Moyen', 'Fort', 'Très fort'];
            const colors = ['text-gray-500', 'text-red-500', 'text-orange-500', 'text-yellow-400', 'text-green-500'];
            
            strengthText.textContent = labels[score];
            strengthText.className = `text-xs font-medium transition-colors duration-300 ${colors[score]}`;
            
            // Trigger confirm validation if it has content
            if (confirmInput.value.length > 0) validateConfirm();
        });

        // --- Real-time Validation ---
        function toggleValidity(inputId, validId, isValid) {
            const icon = document.getElementById(validId);
            if (isValid && inputId.value.length > 0) {
                icon.classList.remove('opacity-0');
            } else {
                icon.classList.add('opacity-0');
            }
        }

        usernameInput.addEventListener('input', () => {
            const isValid = /^[a-zA-Z0-9_\-]{3,30}$/.test(usernameInput.value);
            toggleValidity(usernameInput, 'usernameValid', isValid);
            if (isValid) document.getElementById('usernameError').classList.add('hidden');
        });

        emailInput.addEventListener('input', () => {
            const isValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInput.value);
            toggleValidity(emailInput, 'emailValid', isValid);
            if (isValid) document.getElementById('emailError').classList.add('hidden');
        });

        function validateConfirm() {
            const isValid = confirmInput.value === passwordInput.value && confirmInput.value.length > 0;
            toggleValidity(confirmInput, 'confirmValid', isValid);
            if (isValid) document.getElementById('confirmError').classList.add('hidden');
        }

        confirmInput.addEventListener('input', validateConfirm);

        // --- Form Submission ---
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAllErrors();
            
            const username = usernameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmInput.value;
            const terms = document.getElementById('terms').checked;

            let hasError = false;

            // Validation
            if (username.length < 3) {
                showError('usernameError', 'Minimum 3 caractères requis.');
                hasError = true;
            } else if (!/^[a-zA-Z0-9_\-]+$/.test(username)) {
                showError('usernameError', 'Lettres, chiffres, _ et - uniquement.');
                hasError = true;
            }

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showError('emailError', 'Format d\'email invalide.');
                hasError = true;
            }

            if (password.length < 8) {
                showError('passwordError', 'Minimum 8 caractères requis.');
                hasError = true;
            } else if (!/[A-Z]/.test(password)) {
                showError('passwordError', 'Au moins une majuscule requise.');
                hasError = true;
            } else if (!/[0-9]/.test(password)) {
                showError('passwordError', 'Au moins un chiffre requis.');
                hasError = true;
            }

            if (password !== confirmPassword) {
                showError('confirmError', 'Les mots de passe ne correspondent pas.');
                hasError = true;
            }

            if (!terms) {
                showGlobalError('Vous devez accepter les conditions d\'utilisation.');
                hasError = true;
            }

            if (hasError) {
                form.classList.add('animate-shake');
                setTimeout(() => form.classList.remove('animate-shake'), 500);
                return;
            }

            // Loading state
            setLoading(true);

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('vyrox_user', JSON.stringify(data.user));
                    localStorage.setItem('vyrox_token', data.token);
                    
                    // Success animation
                    submitBtn.innerHTML = '<i class="fa-solid fa-check"></i> Compte créé avec succès !';
                    submitBtn.classList.remove('from-vyrox-purple', 'to-vyrox-pink');
                    submitBtn.classList.add('from-green-500', 'to-emerald-600');
                    
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                } else {
                    // Dispatch errors to specific fields if possible
                    if (data.error.toLowerCase().includes('utilisateur') || data.error.toLowerCase().includes('username')) {
                        showError('usernameError', data.error);
                    } else if (data.error.toLowerCase().includes('email')) {
                        showError('emailError', data.error);
                    } else {
                        showGlobalError(data.error);
                    }
                    form.classList.add('animate-shake');
                    setTimeout(() => form.classList.remove('animate-shake'), 500);
                }
            } catch (err) {
                console.error('Erreur d\'inscription:', err);
                showGlobalError('Erreur de connexion au serveur. Veuillez réessayer.');
                form.classList.add('animate-shake');
                setTimeout(() => form.classList.remove('animate-shake'), 500);
            } finally {
                setLoading(false);
            }
        });

        // --- Helper Functions ---
        function showError(elementId, message) {
            const errorEl = document.getElementById(elementId);
            errorEl.querySelector('span').textContent = message;
            errorEl.classList.remove('hidden');
        }

        function showGlobalError(message) {
            formError.querySelector('span').textContent = message;
            formError.classList.remove('hidden');
        }

        function hideAllErrors() {
            formError.classList.add('hidden');
            document.querySelectorAll('[id$="Error"]').forEach(el => el.classList.add('hidden'));
        }

        function setLoading(isLoading) {
            submitBtn.disabled = isLoading;
            if (isLoading) {
                btnText.textContent = 'Création en cours...';
                btnIcon.classList.add('hidden');
                btnLoader.classList.remove('hidden');
            } else {
                btnText.textContent = 'Créer mon compte';
                btnIcon.classList.remove('hidden');
                btnLoader.classList.add('hidden');
            }
        }

        // --- Auto-redirect if already logged in ---
        if (localStorage.getItem('vyrox_token')) {
            fetch('/api/auth/me', { headers: { 'Authorization': `Bearer ${localStorage.getItem('vyrox_token')}` } })
                .then(r => r.json())
                .then(data => {
                    if (data.success) window.location.href = '/';
                })
                .catch(() => {});
        }
    </script>
</body>
</html>
